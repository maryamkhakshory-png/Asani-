<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>🔧 جعبه ابزار حرفه‌ای</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --dark: #1a1a2e;
            --darker: #16213e;
            --light: #dfe6e9;
            --accent: #00cec9;
            --danger: #d63031;
            --warning: #fdcb6e;
            --success: #00b894;
            --card-bg: #2d3436;
            --text: #dfe6e9;
            --text-secondary: #b2bec3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, var(--darker) 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 10px;
            padding-bottom: 80px;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), #a855f7);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.3);
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .subtitle {
            opacity: 0.9;
            font-size: 14px;
        }

        .device-info {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px;
            font-size: 12px;
            flex-wrap: wrap;
        }

        .search-bar {
            margin-bottom: 15px;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 15px;
            background: var(--card-bg);
            color: var(--text);
            font-size: 16px;
            outline: none;
        }

        .categories {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .cat-btn {
            padding: 8px 16px;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--text);
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 13px;
        }

        .cat-btn.active {
            background: var(--primary);
            color: white;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .tool-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .tool-card:active {
            transform: scale(0.95);
        }

        .tool-card.favorite {
            border-color: var(--warning);
        }

        .tool-card.favorite::after {
            content: '⭐';
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 14px;
        }

        .tool-icon {
            font-size: 35px;
            margin-bottom: 8px;
        }

        .tool-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .tool-desc {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            max-width: 90%;
            width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
            z-index: 100;
            max-width: 500px;
            margin: 0 auto;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 12px;
        }

        .nav-btn.active {
            color: var(--primary);
        }

        .perm-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-right: 4px solid var(--primary);
        }

        .perm-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            color: white;
            background: var(--primary);
        }

        .permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .permission-box {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            text-align: center;
            border: 2px solid var(--primary);
        }

        .permission-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin: 5px 0;
            background: rgba(108,92,231,0.1);
            border-radius: 10px;
            text-align: right;
        }
    </style>
</head>
<body>
    <!-- صفحه درخواست مجوز -->
    <div class="permission-overlay" id="permissionScreen">
        <div class="permission-box">
            <h2 style="font-size: 60px; margin-bottom: 15px;">🔐</h2>
            <h3 style="color: var(--accent); margin-bottom: 15px;">دسترسی‌های لازم</h3>
            <p style="margin-bottom: 20px; font-size: 14px; color: var(--text-secondary);">
                برای استفاده کامل از جعبه ابزار، مجوزهای زیر نیاز است:
            </p>
            
            <div style="margin-bottom: 20px; text-align: right;">
                <div class="permission-item">📱 اطلاعات دستگاه</div>
                <div class="permission-item">💾 ذخیره‌سازی</div>
                <div class="permission-item">📸 دوربین و میکروفن</div>
                <div class="permission-item">📍 موقعیت مکانی</div>
                <div class="permission-item">📞 مدیریت تماس</div>
            </div>
            
            <button onclick="requestAllPermissions()" 
                    style="width: 100%; padding: 15px; background: linear-gradient(135deg, #6c5ce7, #a855f7);
                           color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 16px;
                           margin-bottom: 10px;">
                ✅ اعطای همه مجوزها
            </button>
            
            <button onclick="skipPermissions()" 
                    style="width: 100%; padding: 12px; background: #636e72;
                           color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 14px;">
                ⏭️ بعداً
            </button>
        </div>
    </div>

    <!-- برنامه اصلی -->
    <div class="app-container" id="mainApp" style="display: none;">
        <header class="header">
            <div class="header-content">
                <h1>🔧 جعبه ابزار</h1>
                <p class="subtitle">۲۰ ابزار کاربردی برای کنترل گوشی</p>
            </div>
            <div class="device-info">
                <span id="batteryStatus">🔋 --%</span>
                <span id="timeDisplay">🕐 --:--</span>
                <span id="networkStatus">📶 آنلاین</span>
            </div>
        </header>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 جستجوی ابزار...">
        </div>

        <div class="categories">
            <button class="cat-btn active" data-cat="all">همه</button>
            <button class="cat-btn" data-cat="system">سیستمی</button>
            <button class="cat-btn" data-cat="display">نمایش</button>
            <button class="cat-btn" data-cat="tools">ابزارها</button>
            <button class="cat-btn" data-cat="security">امنیتی</button>
        </div>

        <main class="tools-grid" id="toolsGrid"></main>

        <div class="modal" id="toolModal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <div id="modalContent"></div>
            </div>
        </div>

        <div class="toast" id="toast"></div>

        <nav class="bottom-nav">
            <button class="nav-btn active" data-view="tools">🧰 ابزارها</button>
            <button class="nav-btn" data-view="favorites">⭐ علاقه‌مندی‌ها</button>
            <button class="nav-btn" data-view="settings">⚙️ تنظیمات</button>
        </nav>
    </div>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script>
        // ============================================
        // درخواست مجوزها هنگام ورود
        // ============================================
        
        function requestAllPermissions() {
            // مخفی کردن صفحه مجوز
            document.getElementById('permissionScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            
            // شروع درخواست مجوزها
            const permissions = [];
            
            // درخواست موقعیت مکانی
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    () => console.log('موقعیت مکانی: فعال'),
                    () => console.log('موقعیت مکانی: رد شد')
                );
            }
            
            // درخواست دوربین
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => {
                        stream.getTracks().forEach(track => track.stop());
                        console.log('دوربین: فعال');
                    })
                    .catch(() => console.log('دوربین: رد شد'));
            }
            
            // درخواست میکروفن
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(stream => {
                        stream.getTracks().forEach(track => track.stop());
                        console.log('میکروفن: فعال');
                    })
                    .catch(() => console.log('میکروفن: رد شد'));
            }
            
            // درخواست نوتیفیکیشن
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
            
            // ذخیره در localStorage
            localStorage.setItem('permissions_granted', 'true');
            
            // راه‌اندازی برنامه
            if (!window.app) {
                window.app = new Toolbox();
            }
        }
        
        function skipPermissions() {
            document.getElementById('permissionScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            
            if (!window.app) {
                window.app = new Toolbox();
            }
        }
        
        // بررسی اینکه قبلاً مجوز داده شده یا نه
        window.addEventListener('DOMContentLoaded', () => {
            const granted = localStorage.getItem('permissions_granted');
            
            if (granted === 'true') {
                // قبلاً مجوز داده، مستقیم برو به برنامه
                document.getElementById('permissionScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                window.app = new Toolbox();
            }
            // اگر مجوز نداده، صفحه درخواست مجوز نمایش داده میشه
        });

        // ============================================
        // کلاس اصلی جعبه ابزار
        // ============================================
        
        class Toolbox {
            constructor() {
                this.tools = this.getTools();
                this.favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
                this.lastClickId = null;
                this.lastClickTime = 0;
                this.init();
            }

            getTools() {
                return [
                    { id: 1, name: '🔄 ریستارت سریع', desc: 'راه‌اندازی مجدد', category: 'system', icon: '🔄', action: () => this.restart() },
                    { id: 2, name: '📱 اطلاعات دستگاه', desc: 'مشخصات کامل گوشی', category: 'system', icon: '📱', action: () => this.deviceInfo() },
                    { id: 3, name: '🧹 پاکسازی کش', desc: 'حافظه کش را پاک کن', category: 'system', icon: '🧹', action: () => this.clearCache() },
                    { id: 4, name: '📊 مصرف RAM', desc: 'نمایش حافظه مصرفی', category: 'system', icon: '📊', action: () => this.ramUsage() },
                    { id: 5, name: '🔋 باتری', desc: 'وضعیت باتری', category: 'system', icon: '🔋', action: () => this.batteryStatus() },
                    { id: 6, name: '💡 نور صفحه', desc: 'تنظیم روشنایی', category: 'display', icon: '💡', action: () => this.brightness() },
                    { id: 7, name: '🌀 چرخش', desc: 'قفل چرخش صفحه', category: 'display', icon: '🌀', action: () => this.rotation() },
                    { id: 8, name: '👁️ حالت مطالعه', desc: 'فیلتر نور آبی', category: 'display', icon: '👁️', action: () => this.readMode() },
                    { id: 9, name: '⏱️ روشن ماندن', desc: 'صفحه همیشه روشن', category: 'display', icon: '⏱️', action: () => this.stayAwake() },
                    { id: 10, name: '🎨 تم', desc: 'تاریک/روشن', category: 'display', icon: '🎨', action: () => this.changeTheme() },
                    { id: 11, name: '📸 اسکرین‌شات', desc: 'عکس از صفحه', category: 'tools', icon: '📸', action: () => this.screenshot() },
                    { id: 12, name: '🔊 تست صدا', desc: 'تست اسپیکر', category: 'tools', icon: '🔊', action: () => this.soundTest() },
                    { id: 13, name: '📡 وای‌فای', desc: 'اطلاعات شبکه', category: 'tools', icon: '📡', action: () => this.wifiInfo() },
                    { id: 14, name: '📋 کلیپ‌بورد', desc: 'مدیریت کپی', category: 'tools', icon: '📋', action: () => this.clipboard() },
                    { id: 15, name: '🧮 ماشین حساب', desc: 'محاسبات سریع', category: 'tools', icon: '🧮', action: () => this.calculator() },
                    { id: 16, name: '🔐 قفل برنامه', desc: 'رمز روی برنامه', category: 'security', icon: '🔐', action: () => this.appLock() },
                    { id: 17, name: '🕵️ مجوزها', desc: 'مدیریت دسترسی‌ها', category: 'security', icon: '🕵️', action: () => this.permissions() },
                    { id: 18, name: '🗑️ پاک‌سازی امن', desc: 'حذف اطلاعات', category: 'security', icon: '🗑️', action: () => this.cleanData() },
                    { id: 19, name: '🔍 اسکن امنیتی', desc: 'بررسی بدافزار', category: 'security', icon: '🔍', action: () => this.scan() },
                    { id: 20, name: '📞 بلاک تماس', desc: 'مسدودکننده', category: 'security', icon: '📞', action: () => this.blockCall() }
                ];
            }

            init() {
                this.renderTools();
                this.setupEvents();
                this.updateDeviceInfo();
                setInterval(() => this.updateDeviceInfo(), 1000);
            }

            renderTools(filter = 'all', search = '') {
                const grid = document.getElementById('toolsGrid');
                let tools = this.tools;
                if (filter !== 'all') tools = tools.filter(t => t.category === filter);
                if (search) tools = tools.filter(t => t.name.includes(search) || t.desc.includes(search));

                grid.innerHTML = tools.map(tool => `
                    <div class="tool-card ${this.favorites.includes(tool.id) ? 'favorite' : ''}" 
                         style="position: relative;" onclick="app.openTool(${tool.id})">
                        <div class="tool-icon">${tool.icon}</div>
                        <div class="tool-name">${tool.name}</div>
                        <div class="tool-desc">${tool.desc}</div>
                    </div>
                `).join('');
            }

            setupEvents() {
                document.querySelectorAll('.cat-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.renderTools(e.target.dataset.cat, document.getElementById('searchInput').value);
                    });
                });

                document.getElementById('searchInput').addEventListener('input', (e) => {
                    const activeCat = document.querySelector('.cat-btn.active').dataset.cat;
                    this.renderTools(activeCat, e.target.value);
                });

                document.querySelector('.close-modal').addEventListener('click', () => {
                    document.getElementById('toolModal').classList.remove('show');
                });

                document.getElementById('toolModal').addEventListener('click', (e) => {
                    if (e.target === document.getElementById('toolModal')) {
                        document.getElementById('toolModal').classList.remove('show');
                    }
                });

                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.handleView(e.target.dataset.view);
                    });
                });
            }

            openTool(id) {
                if (this.lastClickId === id && Date.now() - this.lastClickTime < 400) {
                    this.toggleFavorite(id);
                    return;
                }
                this.lastClickId = id;
                this.lastClickTime = Date.now();
                const tool = this.tools.find(t => t.id === id);
                if (tool) tool.action();
            }

            toggleFavorite(id) {
                if (this.favorites.includes(id)) {
                    this.favorites = this.favorites.filter(f => f !== id);
                    this.showToast('⭐ از علاقه‌مندی‌ها حذف شد');
                } else {
                    this.favorites.push(id);
                    this.showToast('⭐ به علاقه‌مندی‌ها اضافه شد');
                }
                localStorage.setItem('favorites', JSON.stringify(this.favorites));
                this.renderTools();
            }

            handleView(view) {
                if (view === 'favorites') {
                    const favTools = this.tools.filter(t => this.favorites.includes(t.id));
                    document.getElementById('toolsGrid').innerHTML = favTools.length ? 
                        favTools.map(t => `<div class="tool-card favorite" style="position:relative;" onclick="app.openTool(${t.id})"><div class="tool-icon">${t.icon}</div><div class="tool-name">${t.name}</div></div>`).join('') :
                        '<div style="text-align:center;padding:40px;grid-column:1/-1;">⭐ با دابل کلیک اضافه کن</div>';
                } else if (view === 'settings') {
                    this.showModal('⚙️ تنظیمات', `
                        <button onclick="app.clearCache()" style="width:100%;padding:12px;margin:5px 0;background:#6c5ce7;color:white;border:none;border-radius:8px;">🧹 پاکسازی کش</button>
                        <button onclick="app.cleanData()" style="width:100%;padding:12px;margin:5px 0;background:#d63031;color:white;border:none;border-radius:8px;">🗑️ بازنشانی</button>
                        <button onclick="app.changeTheme()" style="width:100%;padding:12px;margin:5px 0;background:#636e72;color:white;border:none;border-radius:8px;">🎨 تغییر تم</button>
                    `);
                } else {
                    this.renderTools();
                }
            }

            // ابزارها
            restart() { this.showToast('🔄 درخواست ریستارت'); }
            
            deviceInfo() {
                this.showModal('📱 مشخصات', `
                    پلتفرم: ${navigator.platform}<br>
                    زبان: ${navigator.language}<br>
                    آنلاین: ${navigator.onLine ? '✅' : '❌'}<br>
                    صفحه: ${screen.width}x${screen.height}<br>
                    هسته: ${navigator.hardwareConcurrency || '؟'}
                `);
            }

            clearCache() {
                if ('caches' in window) caches.keys().then(names => names.forEach(n => caches.delete(n)));
                this.showToast('🧹 کش پاک شد');
            }

            ramUsage() {
                if (performance.memory) {
                    const u = (performance.memory.usedJSHeapSize / 1048576).toFixed(1);
                    this.showToast(`📊 RAM: ${u} MB`);
                } else {
                    this.showToast('📊 غیرقابل دسترس');
                }
            }

            batteryStatus() {
                if ('getBattery' in navigator) {
                    navigator.getBattery().then(b => {
                        this.showToast(`🔋 ${Math.round(b.level*100)}% ${b.charging ? '⚡' : ''}`);
                    });
                }
            }

            brightness() {
                const v = prompt('روشنایی (0-100):', '50');
                if (v) document.body.style.filter = `brightness(${0.5 + Math.min(100,Math.max(0,parseInt(v)))/100 * 1.5})`;
                this.showToast(`💡 ${v}%`);
            }

            rotation() {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('portrait').then(() => this.showToast('🌀 قفل شد'));
                }
            }

            readMode() {
                const el = document.createElement('div');
                el.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,200,100,0.2);z-index:9999;pointer-events:none;';
                document.body.appendChild(el);
                this.showToast('👁️ فعال شد');
                setTimeout(() => el.remove(), 300000);
            }

            stayAwake() {
                if ('wakeLock' in navigator) {
                    navigator.wakeLock.request('screen').then(() => this.showToast('⏱️ روشن می‌ماند'));
                }
            }

            changeTheme() {
                const isDark = document.body.style.background.includes('1a1a2e');
                document.body.style.background = isDark ? 'linear-gradient(135deg, #dfe6e9, #b2bec3)' : 'linear-gradient(135deg, #1a1a2e, #16213e)';
                document.body.style.color = isDark ? '#2d3436' : '#dfe6e9';
                localStorage.setItem('theme', isDark ? 'light' : 'dark');
                this.showToast(isDark ? '☀️ روشن' : '🌙 تاریک');
            }

            screenshot() {
                this.showToast('📸 در حال اسکرین‌شات...');
                try {
                    html2canvas(document.querySelector('.app-container'), {
                        scale: 2, backgroundColor: '#1a1a2e', allowTaint: true, useCORS: true
                    }).then(canvas => {
                        const link = document.createElement('a');
                        link.download = `screenshot_${Date.now()}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        this.showToast('✅ ذخیره شد!');
                        this.showModal('📸 پیش‌نمایش', `<img src="${canvas.toDataURL()}" style="width:100%;border-radius:10px;">`);
                    }).catch(() => this.showToast('⚠️ خطا'));
                } catch(e) {
                    this.showToast('⚠️ ناموفق');
                }
            }

            soundTest() {
                new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACAf39/f4B/f3+Af39/gH9/f4B/f3+Af39/gH9/f4B/f3+Af39/gH9/f4B/f38=').play()
                    .then(() => this.showToast('🔊 پخش شد'))
                    .catch(() => this.showToast('⚠️ خطا'));
            }

            wifiInfo() { this.showToast(navigator.onLine ? '📶 آنلاین' : '📵 آفلاین'); }
            
            clipboard() {
                navigator.clipboard.readText().then(t => this.showModal('📋 کلیپ‌بورد', t || 'خالی'))
                    .catch(() => this.showToast('⚠️ غیرقابل دسترس'));
            }

            calculator() {
                const e = prompt('عبارت:');
                if (e && /^[0-9+\-*/().%\s]+$/.test(e)) {
                    try { this.showToast(`🧮 ${eval(e)}`); } catch { this.showToast('⚠️ نامعتبر'); }
                }
            }

            appLock() {
                const c = localStorage.getItem('appLock');
                if (c) {
                    if (prompt('رمز فعلی:') === c) { localStorage.removeItem('appLock'); this.showToast('🔓 باز شد'); }
                } else {
                    const p = prompt('رمز جدید:');
                    if (p && p.length >= 4) { localStorage.setItem('appLock', p); this.showToast('🔐 قفل شد'); }
                }
            }

            permissions() {
                this.showModal('🕵️ مجوزها', `
                    <button onclick="requestAllPermissions()" style="width:100%;padding:12px;background:#6c5ce7;color:white;border:none;border-radius:8px;margin:5px 0;">🚀 درخواست همه مجوزها</button>
                    <button onclick="app.requestPerm('camera')" class="perm-btn" style="width:100%;margin:5px 0;">📷 درخواست دوربین</button>
                    <button onclick="app.requestPerm('microphone')" class="perm-btn" style="width:100%;margin:5px 0;">🎤 درخواست میکروفن</button>
                    <button onclick="app.requestPerm('location')" class="perm-btn" style="width:100%;margin:5px 0;">📍 درخواست موقعیت</button>
                `);
            }

            async requestPerm(type) {
                try {
                    if (type === 'camera') {
                        const s = await navigator.mediaDevices.getUserMedia({video:true});
                        s.getTracks().forEach(t => t.stop());
                        this.showToast('✅ دوربین فعال شد');
                    } else if (type === 'microphone') {
                        const s = await navigator.mediaDevices.getUserMedia({audio:true});
                        s.getTracks().forEach(t => t.stop());
                        this.showToast('✅ میکروفن فعال شد');
                    } else if (type === 'location') {
                        navigator.geolocation.getCurrentPosition(
                            () => this.showToast('✅ موقعیت فعال شد'),
                            () => this.showToast('❌ رد شد')
                        );
                    }
                } catch { this.showToast('❌ رد شد'); }
            }

            cleanData() {
                if (confirm('پاک شود؟')) { localStorage.clear(); this.showToast('🗑️ انجام شد'); setTimeout(() => location.reload(), 1500); }
            }

            scan() {
                this.showToast('🔍 اسکن...');
                setTimeout(() => this.showToast(Math.random() > 0.8 ? '⚠️ هشدار' : '✅ امن'), 2000);
            }

            blockCall() {
                const b = JSON.parse(localStorage.getItem('blocked') || '[]');
                const n = prompt('شماره:');
                if (n) { b.push(n); localStorage.setItem('blocked', JSON.stringify(b)); this.showToast(`📞 ${n} بلاک شد`); }
                else this.showModal('📞 لیست', b.length ? b.join('<br>') : 'خالی');
            }

            showModal(title, content) {
                document.getElementById('modalContent').innerHTML = `<h2 style="color:var(--accent);margin-bottom:15px">${title}</h2><div>${content}</div>`;
                document.getElementById('toolModal').classList.add('show');
            }

            showToast(msg) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.add('show');
                clearTimeout(this._tt);
                this._tt = setTimeout(() => t.classList.remove('show'), 2500);
            }

            updateDeviceInfo() {
                document.getElementById('timeDisplay').textContent = `🕐 ${new Date().toLocaleTimeString('fa-IR')}`;
                if ('getBattery' in navigator) {
                    navigator.getBattery().then(b => {
                        document.getElementById('batteryStatus').textContent = `${b.charging?'⚡':''}🔋 ${Math.round(b.level*100)}%`;
                    });
                }
                document.getElementById('networkStatus').textContent = navigator.onLine ? '📶 آنلاین' : '📵 آفلاین';
            }
        }
    </script>
</body>
</html>
